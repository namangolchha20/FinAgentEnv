name: FinAgentEnv
description: >-
  OpenEnv personal finance simulation. Agents manage cash flow, debt, eight
  asset classes, real estate, credit score, and weighted life events across
  six monthly steps under bull/bear/sideways market regimes.
version: 2.0.0
entry_point: env.environment:FinAgentEnv
tasks:
  - id: debt_trap
    grader: env.graders:grade_debt_trap
  - id: balanced_growth
    grader: env.graders:grade_balanced_growth
  - id: adversarial_crash
    grader: env.graders:grade_adversarial_crash
